# Render Blueprint for the backend API (Render dashboard → New → Blueprint → select this repo).
# After the first deploy, set CORS_ORIGINS to your Vercel URL and redeploy.
services:
  - type: web
    name: yt-media-toolkit-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    # "free" sleeps after 15 min idle (in-memory jobs are lost then) and has 512 MB RAM;
    # use "starter" or higher for regular use and 4K/H.264 re-encodes.
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false            # e.g. https://yt-media-toolkit.vercel.app
      - key: CORS_ORIGIN_REGEX
        sync: false            # optional, e.g. ^https://yt-media-toolkit(-[a-z0-9-]+)?\.vercel\.app$
      - key: TRUST_PROXY_HEADERS
        value: "true"          # Render's proxy sets X-Forwarded-For
      - key: RETENTION_MINUTES
        value: "60"
      - key: STT_PROVIDER
        value: none            # or openai_compatible (then also set STT_API_KEY)
      - key: STT_API_KEY
        sync: false
