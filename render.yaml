# Render Blueprint: ONE web service that serves both the UI and the API.
# Render dashboard → New → Blueprint → select this repository → Apply.
services:
  - type: web
    name: yt-media-toolkit
    runtime: docker
    dockerfilePath: ./Dockerfile
    # "free" sleeps after 15 min idle (in-memory jobs are lost then) and has 512 MB RAM;
    # use "starter" or higher for regular use and 4K/H.264 re-encodes.
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true    # signs download links
      - key: TRUST_PROXY_HEADERS
        value: "true"          # Render's proxy sets X-Forwarded-For (per-client rate limits)
      - key: RETENTION_MINUTES
        value: "60"
      # --- YouTube bot checks (README: "YouTube bot checks") -------------------------
      # The PO-token provider is built into the image and on by default (POT_PROVIDER=bgutil).
      # If YouTube still blocks Render's IP, add cookies and/or a proxy:
      - key: YTDLP_COOKIES_FILE
        value: /etc/secrets/cookies.txt   # upload cookies.txt under Environment → Secret Files
      - key: YTDLP_PROXY
        sync: false            # optional, e.g. http://user:pass@residential-proxy:port
      - key: STT_PROVIDER
        value: none            # or openai_compatible (then also set STT_API_KEY)
      - key: STT_API_KEY
        sync: false            # entered in the dashboard; never committed
